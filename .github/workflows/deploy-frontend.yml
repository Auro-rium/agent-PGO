name: Deploy TwineRun frontend

on:
  push:
    branches: [frontendv1]
    paths:
      - "landingpage/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  LAMBDA_FUNCTION_NAME: agentpgo-frontend
  FUNCTION_URL: https://2syexxoronpapxxxhzu6grgi4a0limkr.lambda-url.us-east-1.on.aws/

jobs:
  deploy:
    name: Build, deploy, and smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landingpage
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landingpage/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Inspect OIDC claims
        shell: bash
        run: |
          set -euo pipefail
          token="$(curl --fail --silent --show-error -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | python3 -c 'import json,sys,base64; t=json.load(sys.stdin)["value"]; p=t.split(".")[1]; p += "=" * (-len(p) % 4); print(base64.urlsafe_b64decode(p).decode())')"
          python3 -c 'import json,sys; c=json.loads(sys.argv[1]); print("OIDC sub:", c.get("sub")); print("OIDC aud:", c.get("aud"))' "$token"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_FRONTEND_DEPLOY_ROLE_ARN }}
          role-session-name: twinerun-frontend-${{ github.run_id }}

      - name: Package Lambda site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .lambda-package .lambda-package.zip
          mkdir -p .lambda-package/site
          cp -R dist/. .lambda-package/site/
          cp lambda/handler.py .lambda-package/handler.py
          (cd .lambda-package && zip -qr ../.lambda-package.zip .)

      - name: Deploy Lambda
        shell: bash
        run: |
          set -euo pipefail
          aws lambda update-function-code \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --zip-file fileb://.lambda-package.zip \
            --publish \
            --region "$AWS_REGION"
          aws lambda wait function-updated \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --region "$AWS_REGION"

      - name: Smoke test live frontend
        shell: bash
        run: |
          set -euo pipefail
          html="$(curl --fail --silent --show-error "$FUNCTION_URL")"
          grep -q '<title>TwineRun — Operational AI Infrastructure</title>' <<< "$html"
          asset="$(grep -o 'assets/index-[A-Za-z0-9_-]*\.js' <<< "$html" | head -1)"
          test -n "$asset"
          bundle="$(curl --fail --silent --show-error "$FUNCTION_URL$asset")"
          grep -q 'EMPIRICAL BENCHMARKS' <<< "$bundle"
          grep -q 'twinerun-logo.png' <<< "$bundle"
          ! grep -Eqi 'Vesper\.ai|AgentPGO|See It Work' <<< "$bundle"
          echo "TwineRun frontend smoke test passed: $FUNCTION_URL"
